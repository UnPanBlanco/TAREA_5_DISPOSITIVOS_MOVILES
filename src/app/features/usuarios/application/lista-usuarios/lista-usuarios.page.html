<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>lista-usuarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">lista-usuarios</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list>
    @for(item of this.usuariosList(); track $index) {
    <ion-item (click)="this.usuarioClickedHandler(item)"> {{item.username}} </ion-item>
    }
  </ion-list>
</ion-content>
