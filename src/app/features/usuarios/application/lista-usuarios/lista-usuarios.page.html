<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Lista de usuarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Lista de usuarios</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-toggle [formControl]="this.tglFormCtrl">Solo favoritos</ion-toggle>

  <ion-list>
    @for(item of this.usuarios_a_mostrar(); track $index) {
    <ion-item>
      <div style="width: 100%" (click)="this.usuarioClickedHandler(item)">{{item.username}}</div>
      <ion-button fill="clear" slot="end" (click)="this.favoritoClickHandler(item)">
        <ion-icon name="star" [color]="item.is_favorite ? 'tertiary' : 'medium'"></ion-icon>
      </ion-button>
    </ion-item>
    }
  </ion-list>
</ion-content>
