<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Posts del usuario: {{this.id_usuario}} - {{this.nombre}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Posts del usuario: {{this.id_usuario}} - {{this.nombre}}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    @for(item of this.posts(); track $index) {
    <ion-item>
      <div>
        {{item.title}}
        <hr>
        {{item.body}}
      </div>
    </ion-item>
    }
  </ion-list>
</ion-content>
